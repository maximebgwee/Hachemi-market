<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hachemi Market{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="awning-strip"></div>
<header class="navbar">
    <a href="{{ url_for('index') }}" class="logo">
        <span class="logo-mark">H</span>
        <span class="logo-word">Hachemi Market</span>
    </a>
    <nav>
        <a href="{{ url_for('index') }}">Boutique</a>
        <a href="{{ url_for('admin_panel') }}">Admin</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <p>Hachemi Market © 2026 — Tous droits réservés</p>
    <p class="creator-credit">Créateur&nbsp;: Hachemi ._.</p>
</footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
    var reveals = document.querySelectorAll(".reveal");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion || !("IntersectionObserver" in window)) {
        reveals.forEach(function (el) { el.classList.add("is-visible"); });
        return;
    }
    var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.15 });
    reveals.forEach(function (el) { observer.observe(el); });
});
</script>
</body>
</html>
